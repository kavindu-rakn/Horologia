<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Luxury Bezel -->
  <circle cx="32" cy="32" r="30" stroke="#d4af37" stroke-width="2.5" fill="#08090d"/>
  <circle cx="32" cy="32" r="26.5" stroke="#997a15" stroke-width="0.8" stroke-dasharray="1 3"/>
  <!-- Hour Markers -->
  <line x1="32" y1="7" x2="32" y2="12" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="57" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  <line x1="7" y1="32" x2="12" y2="32" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="57" y2="32" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  <!-- Tourbillon / Movement Silhouette Window -->
  <circle cx="32" cy="41" r="7" stroke="#d4af37" stroke-width="1" stroke-dasharray="2 2" fill="#12151e"/>
  <circle cx="32" cy="41" r="2" fill="#d91e4a"/>
  <!-- Watch Hands at 10:10 (Haute Horlogerie Standard) -->
  <!-- Hour Hand pointing to ~10 -->
  <line x1="32" y1="32" x2="21" y2="21" stroke="#f5e6b3" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Minute Hand pointing to ~2 -->
  <line x1="32" y1="32" x2="45" y2="19" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Center Pivot with Ruby -->
  <circle cx="32" cy="32" r="3.2" fill="#d4af37"/>
  <circle cx="32" cy="32" r="1.4" fill="#d91e4a"/>
</svg>
